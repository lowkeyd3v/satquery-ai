<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SatQuery AI | SIH26167 — ISRO</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23070709'/><circle cx='16' cy='16' r='9' fill='none' stroke='%2322d3ee' stroke-width='2'/><circle cx='16' cy='16' r='3' fill='%2322d3ee'/><line x1='16' y1='4' x2='16' y2='9' stroke='%2322d3ee' stroke-width='1.5'/><line x1='16' y1='23' x2='16' y2='28' stroke='%2322d3ee' stroke-width='1.5'/><line x1='4' y1='16' x2='9' y2='16' stroke='%2322d3ee' stroke-width='1.5'/><line x1='23' y1='16' x2='28' y2='16' stroke='%2322d3ee' stroke-width='1.5'/></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="brand" id="brandLogo" title="Reset SatQuery AI">
      <div class="brand-text">
        <h1>SatQuery <span class="accent">AI</span><span class="brand-tag">ISRO</span></h1>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="/docs" target="_blank" class="docs-link">API Docs ↗</a>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot" id="statusDot"></span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN LAYOUT ================= -->
  <div class="layout">

    <!-- ============ SIDE NAVIGATION / CONTROL BAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-header">
          <span class="section-label">Query Console</span>
          <span class="shortcut-badge">Enter ↵</span>
        </div>
        <form id="queryForm" autocomplete="off">
          <textarea
            id="queryInput"
            placeholder="Type a natural language request, e.g. 'Highlight flooded regions along the river'…"
            rows="3"
            required
          ></textarea>

          <button type="submit" class="btn primary" id="submitBtn">
            <span>Run Analysis</span>
          </button>
        </form>

        <div class="action-bar">
          <button type="button" class="btn secondary action-btn" id="exportGeoJsonBtn" title="Download current results as GeoJSON">
            <span>Export GeoJSON</span>
          </button>
          <button type="button" class="btn secondary action-btn" id="resetMapBtn" title="Reset map to Pan-India view">
            <span>Reset View</span>
          </button>
        </div>
      </div>

      <div class="sidebar-section">
        <span class="section-label">Preset Scenarios</span>
        <div class="preset-buttons" id="presetButtons">
          <!-- Populated dynamically by app.js -->
          <button class="preset-btn skeleton" disabled>Loading…</button>
        </div>
      </div>

      <div class="sidebar-section">
        <span class="section-label">Live Telemetry</span>
        <div class="metrics-panel" id="metricsPanel">
          <div class="metric-row">
            <span class="metric-label">Class</span>
            <span class="metric-value" id="metricLabel">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Confidence</span>
            <span class="metric-value highlight" id="metricConfidence">—</span>
          </div>
          <div class="confidence-bar-track">
            <div class="confidence-bar-fill" id="confidenceBarFill"></div>
          </div>
          <div class="metric-row">
            <span class="metric-label">Area</span>
            <span class="metric-value" id="metricArea">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Sensor</span>
            <span class="metric-value sensor-tag" id="metricSensor">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Mode</span>
            <span class="metric-value" id="metricMode">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Latency</span>
            <span class="metric-value" id="metricLatency">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Status</span>
            <span class="metric-value" id="metricStatus">IDLE</span>
          </div>
        </div>
      </div>

      <div class="sidebar-section report-section" id="reportSection">
        <span class="section-label">Analysis Report</span>
        <div class="report-panel" id="reportPanel">
          <p class="report-text" id="reportText">Run a query to generate an analysis report.</p>
        </div>
      </div>

      <div class="sidebar-section history-section">
        <div class="section-header">
          <span class="section-label">Query History</span>
          <button type="button" class="clear-history-btn" id="clearHistoryBtn" title="Clear all stored query history">Clear</button>
        </div>
        <ul class="history-log" id="historyLog">
          <li class="history-empty">No queries submitted yet.</li>
        </ul>
      </div>
    </aside>

    <!-- ============ MAP CONTAINER ============ -->
    <main class="map-wrapper">
      <div id="map"></div>

      <!-- Temporal playback bar (shown after query) -->
      <div class="temporal-bar" id="temporalBar">
        <button class="temporal-play-btn" id="temporalPlayBtn" title="Play temporal sequence">▶</button>
        <div class="temporal-track-wrap">
          <div class="temporal-nodes">
            <div class="temporal-node" data-step="0" id="tnode0">
              <div class="tnode-dot"></div>
              <span class="tnode-tag" id="ttag0">T+0</span>
            </div>
            <div class="temporal-line"><div class="temporal-line-fill" id="tline0"></div></div>
            <div class="temporal-node" data-step="1" id="tnode1">
              <div class="tnode-dot"></div>
              <span class="tnode-tag" id="ttag1">T+4d</span>
            </div>
            <div class="temporal-line"><div class="temporal-line-fill" id="tline1"></div></div>
            <div class="temporal-node" data-step="2" id="tnode2">
              <div class="tnode-dot"></div>
              <span class="tnode-tag" id="ttag2">T+8d</span>
            </div>
          </div>
          <div class="temporal-info">
            <span class="temporal-step-label" id="temporalStepLabel">—</span>
            <span class="temporal-date" id="temporalDate">—</span>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
